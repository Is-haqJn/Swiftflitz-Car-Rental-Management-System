<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>You're Offline - Swiftflitz</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    'Segoe UI',
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #0f172a;
                color: #f1f5f9;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                position: relative;
                overflow: hidden;
            }

            body::before {
                content: '';
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 80% 60% at 50% 0%,
                        rgba(37, 99, 235, 0.15) 0%,
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 60% 50% at 80% 100%,
                        rgba(99, 102, 241, 0.1) 0%,
                        transparent 60%
                    );
                pointer-events: none;
            }

            .card {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 1.5rem;
                backdrop-filter: blur(16px);
                padding: 3rem 2.5rem;
                max-width: 400px;
                width: 100%;
                text-align: center;
                position: relative;
            }

            .status-ring {
                width: 88px;
                height: 88px;
                border-radius: 50%;
                background: rgba(239, 68, 68, 0.1);
                border: 2px solid rgba(239, 68, 68, 0.25);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 1.75rem;
                position: relative;
            }

            .status-ring.reconnected {
                background: rgba(34, 197, 94, 0.1);
                border-color: rgba(34, 197, 94, 0.35);
                animation: pulse-green 1s ease-out;
            }

            @keyframes pulse-green {
                0% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 16px rgba(34, 197, 94, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
                }
            }

            .icon-svg {
                width: 40px;
                height: 40px;
                color: #ef4444;
                transition: color 0.4s ease;
            }

            .status-ring.reconnected .icon-svg {
                color: #22c55e;
            }

            .dot {
                position: absolute;
                bottom: 6px;
                right: 6px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #ef4444;
                border: 2px solid #0f172a;
                transition: background 0.4s ease;
            }

            .dot.online {
                background: #22c55e;
                animation: pulse-dot 1.5s ease-in-out 3;
            }

            @keyframes pulse-dot {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.3);
                }
            }

            h1 {
                font-size: 1.45rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                margin-bottom: 0.6rem;
                transition: color 0.4s ease;
            }

            p {
                color: #cbd5e1;
                font-size: 0.9rem;
                line-height: 1.65;
                margin-bottom: 2rem;
            }

            .btn-row {
                display: flex;
                gap: 0.75rem;
                justify-content: center;
            }

            button {
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                border: none;
                border-radius: 0.6rem;
                padding: 0.6rem 1.4rem;
                font-size: 0.875rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.15s ease;
                font-family: inherit;
            }

            .btn-primary {
                background: #2563eb;
                color: #fff;
            }

            .btn-primary:hover {
                background: #1d4ed8;
                transform: translateY(-1px);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.06);
                color: #cbd5e1;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.1);
                transform: translateY(-1px);
            }

            .reconnecting {
                display: none;
                align-items: center;
                gap: 0.5rem;
                justify-content: center;
                color: #22c55e;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 1.25rem;
            }

            .reconnecting.visible {
                display: flex;
            }

            .spinner {
                width: 14px;
                height: 14px;
                border: 2px solid rgba(34, 197, 94, 0.3);
                border-top-color: #22c55e;
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
                flex-shrink: 0;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .brand {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
                margin-top: 2rem;
                color: #475569;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .brand-dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #2563eb;
                opacity: 0.6;
            }

            .credit {
                margin-top: 0.75rem;
                color: #334155;
                font-size: 0.7rem;
                letter-spacing: 0.03em;
            }

            .credit a {
                color: #475569;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.15s;
            }

            .credit a:hover {
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="status-ring" id="statusRing">
                <svg
                    class="icon-svg"
                    id="iconSvg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <div class="dot" id="statusDot"></div>
            </div>

            <h1 id="heading">You're offline</h1>
            <p id="subtext">
                Your internet connection is unavailable. We'll redirect you
                automatically when you're back online.
            </p>

            <div class="reconnecting" id="reconnecting">
                <div class="spinner"></div>
                Reconnected - redirecting...
            </div>

            <div class="btn-row">
                <button class="btn-primary" onclick="location.reload()">
                    <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M23 4v6h-6" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                    Try Again
                </button>
                <button class="btn-secondary" onclick="history.back()">
                    Go Back
                </button>
            </div>

            <div class="brand">
                <div class="brand-dot"></div>
                Swiftflitz Car Rental
                <div class="brand-dot"></div>
            </div>
            <div class="credit">
                Designed &amp; developed by
                <a
                    href="https://ordaq.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    >ORDAQ</a
                >
            </div>
        </div>

        <script>
            var handled = false;

            function handleOnline() {
                if (handled) return;
                handled = true;

                clearInterval(pollTimer);

                var ring = document.getElementById('statusRing');
                var dot = document.getElementById('statusDot');
                var heading = document.getElementById('heading');
                var subtext = document.getElementById('subtext');
                var reconnecting = document.getElementById('reconnecting');
                var btnRow = document.querySelector('.btn-row');

                ring.classList.add('reconnected');
                dot.classList.add('online');
                heading.textContent = "You're back online";
                subtext.textContent = '';
                reconnecting.classList.add('visible');
                btnRow.style.display = 'none';

                setTimeout(function () {
                    window.location.href = '/';
                }, 1500);
            }

            function checkConnectivity() {
                fetch('/?_sw_ping=' + Date.now(), {
                    method: 'HEAD',
                    cache: 'no-store',
                })
                    .then(function (r) {
                        if (r.ok) handleOnline();
                    })
                    .catch(function () {
                        /* still offline */
                    });
            }

            var pollTimer = setInterval(checkConnectivity, 2500);

            window.addEventListener('online', function () {
                setTimeout(checkConnectivity, 200);
            });
        </script>
    </body>
</html>
