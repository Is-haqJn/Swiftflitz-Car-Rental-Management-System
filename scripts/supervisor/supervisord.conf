[unix_http_server]
file=/tmp/ordaq-supervisor.sock

[inet_http_server]
port=127.0.0.1:9001
username=ordaq
password=ordaqswiftauth

[supervisord]
logfile=/home/ordaq/swiftflitzapi.ordaq.com/backend/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/ordaq-supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/ordaq-supervisor.sock
username=ordaq
password=ordaqswiftauth

[program:ordaq-worker]
command=/usr/local/bin/php /home/ordaq/swiftflitzapi.ordaq.com/backend/artisan queue:work --queue=high,email,default,media --sleep=3 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=5
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/ordaq/swiftflitzapi.ordaq.com/backend/storage/logs/worker_%(process_num)02d.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/ordaq/swiftflitzapi.ordaq.com/backend/storage/logs/worker_%(process_num)02d-error.log
stderr_logfile_maxbytes=5MB

[program:ordaq-scheduler]
command=/usr/local/bin/php /home/ordaq/swiftflitzapi.ordaq.com/backend/artisan schedule:work
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/home/ordaq/swiftflitzapi.ordaq.com/backend/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/ordaq/swiftflitzapi.ordaq.com/backend/storage/logs/scheduler-error.log
stderr_logfile_maxbytes=5MB

## run this in cron
# */5 * * * * /home/ordaq/virtualenv/.../3.13/bin/python /home/ordaq/.../scripts/supervisor/supervisor_manager.py ensure >> /home/ordaq/swiftflitzapi.ordaq.com/logs/supervisor_cron.log 2>&1